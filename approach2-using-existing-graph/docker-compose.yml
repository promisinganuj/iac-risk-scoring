services:
  neo4j:
    image: neo4j:5
    container_name: neo4j-risk
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-please-change-me}
      - NEO4J_server_directories_import=/import
      - NEO4J_dbms_security_allow__csv__import__from__file__urls=true
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_apoc_import_file_enabled=true
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - "./plugins:/plugins:ro"
      - "./sample-data:/import/data:ro"
      - "./scripts/neo4j_import.cypher:/import/neo4j_import.cypher:ro"
      - "./scripts/neo4j_import_json.cypher:/import/neo4j_import_json.cypher:ro"
      - "./scripts/validate_graph.cypher:/import/validate_graph.cypher:ro"

volumes:
  neo4j_data:
  neo4j_logs:
